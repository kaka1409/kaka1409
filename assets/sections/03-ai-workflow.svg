<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">AI-assisted engineering workflow</title><desc id="desc">WORKFLOW PIPELINE</desc>
<defs>
<style>
text { font-family: Consolas, "Liberation Mono", monospace; white-space: pre; fill:#dce7f0; }
.bg { fill:#080d17; } .panel { fill:#0b1422; stroke:#20374a; stroke-width:1.2; }
.cyan { fill:#66e4ef; } .pink { fill:#d98be8; } .text { fill:#dce7f0; }
.muted { fill:#8194a8; } .green { fill:#8bd9b1; }
.small { font-size:13px; letter-spacing:1.1px; }
.body { font-size:16px; } .heading { font-size:20px; font-weight:700; letter-spacing:1.2px; }
.art { font-size:14px; letter-spacing:0; }
.art-large { font-size:19px; letter-spacing:0; font-weight:700; } .logo-art { font-size:13px; letter-spacing:0; font-weight:700; }
.glow { animation: glow 4.16s ease-in-out infinite; }
.cursor { animation: blink 1.04s steps(2,end) infinite; }
.scan { animation: scan 4.16s ease-in-out infinite; }
.typing { }
.type-soft { animation: type-soft 4.16s steps(40,end) var(--delay,0s) infinite; }
@keyframes glow { 0%,100% { opacity:.48; } 50% { opacity:1; } }
@keyframes blink { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
@keyframes scan { 0%,100% { transform:translateX(0); opacity:.12; } 50% { transform:translateX(620px); opacity:.65; } }

@keyframes type-soft { 0%,8% { opacity:0; } 28%,82% { opacity:1; } 96%,100% { opacity:0; } }
</style>
</defs>
<rect class="bg" width="900" height="430"/>
<rect x="12" y="12" width="876" height="406" rx="5" class="panel"/>
<path d="M12 54 H888" stroke="#20374a" stroke-width="1"/>
<text x="32" y="39" class="cyan small">KK1409 / 03 / ENGINEERING WORKFLOW</text>
<text x="868" y="39" text-anchor="end" class="muted small">[WORKFLOW PIPELINE]</text>
<text x="32" y="57" class="cyan small glow">+--------------------------------------------------------------------------+</text>
<text x="32" y="402" class="muted small">root@kk1409:~$ <tspan class="cyan cursor">_</tspan></text>
<text x="868" y="402" text-anchor="end" class="green small glow">[ ONLINE ]</text>
<text x="42" y="94" class="pink small typing" style="--delay:0.1s;--steps:28">03 / AI-ASSISTED ENGINEERING</text><text x="42" y="133" class="cyan art typing" style="--delay:0.00s;--steps:43">+----------------+       +----------------+</text><text x="42" y="153" class="cyan art typing" style="--delay:0.08s;--steps:43">| 01 BRAINSTORM  |------&gt;| 02 SPECIFY     |</text><text x="42" y="173" class="cyan art typing" style="--delay:0.16s;--steps:43">| ideas / scope  |       | plans / design |</text><text x="42" y="193" class="cyan art typing" style="--delay:0.24s;--steps:43">+----------------+       +----------------+</text><text x="42" y="213" class="cyan art typing" style="--delay:0.32s;--steps:36">         |                         |</text><text x="42" y="233" class="cyan art typing" style="--delay:0.40s;--steps:36">         v                         v</text><text x="42" y="253" class="cyan art typing" style="--delay:0.48s;--steps:43">+----------------+       +----------------+</text><text x="42" y="273" class="cyan art typing" style="--delay:0.56s;--steps:43">| 04 VERIFY      |&lt;------| 03 DELEGATE    |</text><text x="42" y="293" class="cyan art typing" style="--delay:0.64s;--steps:43">| tests / review |       | CLI agents     |</text><text x="42" y="313" class="cyan art typing" style="--delay:0.72s;--steps:43">+----------------+       +----------------+</text><text x="510" y="151" class="text body typing" style="--delay:0.35s;--steps:38">&gt; Explore product ideas and edge cases</text><text x="510" y="190" class="text body typing" style="--delay:0.7s;--steps:42">&gt; Define architecture, contracts and tasks</text><text x="510" y="229" class="text body typing" style="--delay:1.05s;--steps:39">&gt; Delegate scoped work to coding agents</text><text x="510" y="268" class="text body typing" style="--delay:1.4s;--steps:39">&gt; Review diffs, tests and quality gates</text><text x="42" y="380" class="muted small typing" style="--delay:1.7s;--steps:62">AI SUPPORTS THE PROCESS. ENGINEERING JUDGMENT OWNS THE RESULT.</text>
</svg>