<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Profile and background</title><desc id="desc">IDENTITY RECORD</desc>
<defs>
<style>
text { font-family: Consolas, "Liberation Mono", monospace; white-space: pre; fill:#dce7f0; }
.bg { fill:#080d17; } .panel { fill:#0b1422; stroke:#20374a; stroke-width:1.2; }
.cyan { fill:#66e4ef; } .pink { fill:#d98be8; } .text { fill:#dce7f0; }
.muted { fill:#8194a8; } .green { fill:#8bd9b1; }
.small { font-size:13px; letter-spacing:1.1px; }
.body { font-size:16px; } .heading { font-size:20px; font-weight:700; letter-spacing:1.2px; }
.art { font-size:14px; letter-spacing:0; }
.art-large { font-size:19px; letter-spacing:0; font-weight:700; } .logo-art { font-size:13px; letter-spacing:0; font-weight:700; }
.glow { animation: glow 4.16s ease-in-out infinite; }
.cursor { animation: blink 1.04s steps(2,end) infinite; }
.scan { animation: scan 4.16s ease-in-out infinite; }
.typing { }
.type-soft { animation: type-soft 4.16s steps(40,end) var(--delay,0s) infinite; }
@keyframes glow { 0%,100% { opacity:.48; } 50% { opacity:1; } }
@keyframes blink { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
@keyframes scan { 0%,100% { transform:translateX(0); opacity:.12; } 50% { transform:translateX(620px); opacity:.65; } }

@keyframes type-soft { 0%,8% { opacity:0; } 28%,82% { opacity:1; } 96%,100% { opacity:0; } }
</style>
</defs>
<rect class="bg" width="900" height="460"/>
<rect x="12" y="12" width="876" height="436" rx="5" class="panel"/>
<path d="M12 54 H888" stroke="#20374a" stroke-width="1"/>
<text x="32" y="39" class="cyan small">KK1409 / 01 / SYSTEM IDENTITY</text>
<text x="868" y="39" text-anchor="end" class="muted small">[IDENTITY RECORD]</text>
<text x="32" y="57" class="cyan small glow">+--------------------------------------------------------------------------+</text>
<text x="32" y="432" class="muted small">root@kk1409:~$ <tspan class="cyan cursor">_</tspan></text>
<text x="868" y="432" text-anchor="end" class="green small glow">[ ONLINE ]</text>
<text x="42" y="94" class="pink small typing" style="--delay:0.1s;--steps:19">01 / PROFILE RECORD</text><text x="42" y="133" class="heading typing" style="--delay:0.35s;--steps:21">PHAN HOANG QUOC KHANH</text><text x="42" y="164" class="text typing" style="--delay:0.6s;--steps:49">FULLSTACK DEVELOPER  /  HO CHI MINH CITY, VIETNAM</text><text x="42" y="193" class="muted body typing" style="--delay:0.85s;--steps:54">B.Sc. SOFTWARE ENGINEERING  /  UNIVERSITY OF GREENWICH</text><text x="42" y="238" class="cyan art typing" style="--delay:0.00s;--steps:55">+----------------------+       +----------------------+</text><text x="42" y="255" class="cyan art typing" style="--delay:0.08s;--steps:56">|      HUMAN            |------&gt;|      BUILDER         |</text><text x="42" y="272" class="cyan art typing" style="--delay:0.16s;--steps:56">|  curiosity / growth   |       |  frontend / backend  |</text><text x="42" y="289" class="cyan art typing" style="--delay:0.24s;--steps:55">+----------------------+       +----------------------+</text><text x="42" y="306" class="cyan art typing" style="--delay:0.32s;--steps:43">             |                            |</text><text x="42" y="323" class="cyan art typing" style="--delay:0.40s;--steps:43">             +------------+---------------+</text><text x="42" y="340" class="cyan art typing" style="--delay:0.48s;--steps:27">                          v</text><text x="42" y="357" class="cyan art typing" style="--delay:0.56s;--steps:41">                 [ BUILD / LEARN / SHIP ]</text><text x="42" y="390" class="text body typing" style="--delay:1.15s;--steps:84">I build end-to-end web applications with clear architecture and reliable user flows.</text><text x="42" y="416" class="muted body typing" style="--delay:1.45s;--steps:71">Working across interfaces, backend services, APIs, and relational data.</text>
</svg>